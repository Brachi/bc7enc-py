name: Build Wheels
on:
  push:
    branches: [ "main", "ci" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "ci"]
jobs:
  tests:
    strategy:
      matrix:
          os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/checkout@v4
        with:
          lfs: true
      - run: git submodule update --init --recursive bc7enc_rdo
      - name: Run on ${{ matrix.os }}
        run: |
          python -m pip install .[tests]
          python -m pytest

      - uses: actions/upload-artifact@v4
        with:
          name: tests-output-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./tests-output/*.png


  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5
      - run: git submodule update --init --recursive bc7enc_rdo

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.2.0

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  merge_wheels:
    name: Merge wheel artifacts
    needs: build_wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact/merge@v4
        with:
          name: wheels
          pattern: cibw-wheels-*
          delete-merged: true

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests, merge_wheels]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for PyPI trusted publishing (OIDC); no API token needed
    steps:
      - uses: actions/checkout@v5

      - name: Verify tag matches pyproject.toml version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (version $TAG_VERSION) does not match pyproject.toml version $PKG_VERSION"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: wheels
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
